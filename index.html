<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوست ماينكرافت</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; }
        .card { background: #1e1e1e; max-width: 380px; margin: 0 auto; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        button { background: #2e7d32; color: white; border: none; padding: 14px 28px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; }
        button:active { background: #1b5e20; }
        #status { margin-top: 18px; font-weight: bold; color: #81c784; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>دخول هوست ماينكرافت</h2>
        <p>اضغط الزر لتفعيل الاتصال التلقائي مع السيرفر:</p>
        <button onclick="connect()">تفعيل الاتصال</button>
        <div id="status"></div>
    </div>

    <script>
        async function connect() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "#81c784";
            statusDiv.innerText = "جاري قراءة عنوان IPv6 الخاص بك...";
            
            try {
                // جلب IPv6 حصراً باستخدام api6 بدلاً من api64
                let res = await fetch('https://api6.ipify.org?format=json');
                let data = await res.json();
                let userIP = data.ip;

                statusDiv.innerText = "جاري إرسال إشارة الثقب للسيرفر...";
                
                let protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                let wsHost = window.location.host ? (protocol + window.location.host) : 'wss://you-p71i.onrender.com';
                let ws = new WebSocket(wsHost);

                ws.onopen = () => {
                    ws.send("PUNCH:" + userIP);
                };

                ws.onmessage = (event) => {
                    let msg = event.data;
                    if (msg === "PUNCH_SENT") {
                        statusDiv.innerHTML = "✅ تم الثقب بنجاح!<br>افتح ماينكرافت وادخل الآن.";
                        ws.close();
                    } else if (msg === "ERROR: ONLY_IPV6_ALLOWED") {
                        statusDiv.style.color = "#e57373";
                        statusDiv.innerText = "❌ عذراً، الاتصال متاح فقط لعناوين IPv6.";
                    } else if (msg === "ERROR: SERVER_NOT_CONNECTED") {
                        statusDiv.style.color = "#e57373";
                        statusDiv.innerText = "❌ سيرفر ماينكرافت (T440p) غير متصل حالياً.";
                    } else if (msg === "ERROR: RATE_LIMIT_EXCEEDED") {
                        statusDiv.style.color = "#ffb74d";
                        statusDiv.innerText = "⚠️ انتظر 5 ثوانٍ قبل المحاولة مرة أخرى.";
                    } else {
                        statusDiv.style.color = "#e57373";
                        statusDiv.innerText = "❌ خطأ: " + msg;
                    }
                };

                ws.onerror = () => {
                    statusDiv.style.color = "#e57373";
                    statusDiv.innerText = "❌ فشل الاتصال بسيرفر الإشارة.";
                };
            } catch(e) {
                statusDiv.style.color = "#e57373";
                statusDiv.innerText = "❌ اتصالك لا يدعم IPv6 أو تعذر جلبه!";
            }
        }
    </script>
</body>
</html>
